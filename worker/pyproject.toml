[project]
name = "transcriber-worker"
version = "0.3.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
    "pyannote-audio>=3.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "silero-vad>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs real models and audio"]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transcriber"]
