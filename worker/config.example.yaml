# Локальный транскрибатор — настройки воркера. Пути с ~ разворачиваются.
# Это пример; рабочая копия — config.yaml в каталоге данных, её создаёт `transcriber init`.
vault_root: ~/Documents/Vault
# Папки внутри вольта: Raw-транскрипты и заметки встреч
raw_subdir: Raw/Transcripts
meetings_subdir: Meetings
# Приватные записи (в meta.json стоит private: true) идут сюда, а не в вольт: ни транскрипта,
# ни заметки, ни голоса в библиотеке. Каталог и файлы — только для владельца (0700/0600).
private_dir: ~/Documents/Приватные записи
# Транскрипты корпоративного бота Толка (заметки бота Толка) в вольте — эталон для `transcriber bench-ref`.
reference_subdir: Raw/TalkBot
# Судья контекста для `bench-ref --judge`: модель Claude; ключ — ANTHROPIC_API_KEY в .env каталога данных.
judge_model: claude-opus-5-5
judge_chunk_words: 1200
min_silence_ms: 700
max_utterance_s: 30
# Блоки: реплики склеиваются и уходят в whisper пачкой — точнее, чем по одной фразе.
block_min_s: 45          # минимум блока: короче в модель не отправляем
block_max_s: 90          # максимум: дальше режем на границе реплики, чтобы текст не ждал
block_gap_s: 1.5         # пауза, по которой блок закрывается после набранного минимума
block_gap_keep_s: 0.5    # столько тишины оставляем в склейке вместо реальной паузы
block_idle_s: 4          # тишины после последней реплики — закрываем блок, не ждём продолжения
carry_context: true      # хвост прошлого блока канала уходит в промпт следующего
# Память: MLX складывает освобождённые Metal-буферы whisper в кеш и по умолчанию его почти не ограничивает
# (~95% памяти машины) — воркер за сутки вырастал до 14 ГБ и загонял ноут в своп. Сверх лимита кеш
# отдаётся системе, между встречами сбрасывается целиком; на скорости не сказывается (память единая).
mlx_cache_mb: 2048
# Кеш ограничен, но за неделю воркер всё равно дорастал до 11 ГБ: копится что-то ещё. Когда встреч нет,
# а воркер держит больше idle_restart_mb, он выходит и launchd поднимает чистый (модели грузятся ~10 с
# на следующей встрече). 0 — выключить.
idle_restart_mb: 3500
# Посреди встречи whisper течёт на ~5 ГБ в час разговора (malloc, не кеш MLX). Сверх этого воркер выходит
# и продолжает сессию с сохранённых смещений — аудио всё это время пишет приложение. 0 — выключить.
busy_restart_mb: 6000
# Запись без STOP, чьё аудио столько минут не растёт, считаем брошенной (упало приложение, не стартовал
# захват) и финализируем — иначе она держит воркер «на встрече» и сброс кеша не срабатывает.
abandoned_after_min: 10
# Запись оборвалась и стартовала заново: сессия с тем же названием не позже стольких минут после конца
# прошлой — продолжение той же встречи: один Raw, одна заметка, отметка «запись прервана». 0 — выключить.
continue_gap_min: 20
# Диаризация: подобрано стендом bench-diar 14.10 — реплики короче min_embed_s отпечатка не получают и
# наследуют метку соседа; порог похожести 0.4 (0.3 склеивал людей, 0.55 дробил одного на несколько).
min_embed_s: 2.0
speaker_similarity: 0.4
# Голосовые профили: библиотека в voices/ каталога данных, пополняется через transcriber learn.
voice_match_similarity: 0.6   # ниже — кластер остаётся «Speaker N»; поднять, если имена липнут не к тем
voice_min_samples: 3           # кластер короче именем не подписываем
# Имена из интерфейса Толка: приложение пишет плитки участников в talk.jsonl рядом с дорожками.
# Переговорка (один микрофон на несколько человек) и бот-саммаризатор имён не раздают — такие
# отрезки остаются за голосовыми кластерами. Шаблоны — регулярные выражения, регистр не важен.
talk_room_patterns: ["^\\d{3}", "переговор", "room"]
talk_bot_patterns: ["ktalk secretary", "саммаризатор", "bot"]
# Общие микрофоны: плитки, за которыми несколько голосов (плитка владельца добавляется из owner_talk_name),
# именами из Толка не становятся — как переговорки. Совпадение по подстроке без учёта регистра.
talk_shared_names: []
# Кластер, в котором два человека по плиткам держат не меньше этой доли реплик каждый, — склейка голосов:
# режется по плиткам, остаток уходит к ближайшей половине (тикет 04). 0 — выключить.
talk_split_share: 0.3
talk_split_min_count: 3   # и не меньше стольких реплик у каждого из двух имён
# Кластер, уверенно названный Толком, сам ложится в библиотеку голосов под этим именем
# (источник «<сессия>:talk»). Выключить, если библиотеку хочется вести только руками.
talk_autolearn: true
# Владелец установки: как он зовётся в заметках и библиотеке голосов, как подписана его плитка в
# Толке (имён из Толка не получает) и заголовок его секции в MTG-заглушке — вольт и его рутины
# ищут заголовок дословно. Под другого пользователя меняются эти три строки.
owner_name: Owner
owner_talk_name: ""
owner_thoughts_heading: "## Мысли владельца"
# Голосовой профиль владельца копится сам с «чистых» записей микрофона (owner.py); пока в нём
# меньше owner_min_samples отпечатков, канал микрофона целиком остаётся «Me».
owner_autolearn: true
owner_min_samples: 30
echo_overlap: 0.8
echo_similarity: 0.6
echo_strong_similarity: 0.8
# Подавление эха по звуку: из микрофона вычитается то, что в это время играло в динамиках.
# Текстовый фильтр выше остаётся вторым рубежом. Проверено на стенде по трём записям.
echo_suppress: true
echo_beta: 2.0           # запас на недооценку тракта; ниже 1.5 эхо остаётся слышным для VAD
echo_beta_loud: 0        # запас при громких динамиках (усиление тракта 0.4), 0 — выключено: на стенде 14.10 и 3.0, и адаптивный
                         # резали речь владельца на обычной записи; опыт — --set echo_beta_loud=3
echo_floor: 0.05         # глубже корзину не давим — останется дыра вместо звука
# Остаток эха по звуку: если от реплики микрофона подавитель оставил меньше этой доли энергии
# и она почти целиком идёт поверх речи динамиков — это не владелец, а недодавленное эхо, на
# котором whisper сочиняет бессмыслицу. Владелец поверх собеседника сохраняет от 0.17. 0 — выкл.
echo_kept_max: 0.15
echo_kept_min_cover: 0.8 # какая доля реплики должна быть накрыта речью динамиков
# на период настройки; выключить, когда качество устроит
keep_audio: true
# Фразы, которые whisper галлюцинирует на тишине; вырезаются из текста.
hallucinations:
  - Субтитры сделал DimaTorzok
  - Субтитры создавал DimaTorzok
  - Редактор субтитров А.Семкин
  - Корректор А.Егорова
  - Продолжение следует
  - Спасибо за просмотр
